<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Bootstrap Quiz</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .quiz-card {
            border-radius: 1rem;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .option-btn {
            text-align: left;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            transition: all 0.2s ease-in-out;
            word-wrap: break-word;
            white-space: normal;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .progress {
            height: 8px;
            border-radius: 0;
            background-color: #e9ecef;
        }

        /* Utility classes for hiding/showing screens */
        .d-none {
            display: none !important;
        }

        .result-icon {
            font-size: 4rem;
            color: #ffc107;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    {% include 'quiz_app/navbar.html' %}

    <div class="container pb-3">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- CSRF Token for JS use -->
                {% csrf_token %}

                <div class="card quiz-card border-0">

                    <!-- Start Screen -->
                    <div id="start-screen" class="card-body p-5 text-center">
                        <div class="mb-4">
                            <i class="bi bi-controller text-primary" style="font-size: 4rem;"></i>
                        </div>
                        <h2 class="card-title fw-bold mb-3">Welcome to the {{ category }} Quiz!</h2>
                        <p class="card-text text-muted mb-4">Test your knowledge. Click the button below when you are
                            ready to begin.</p>
                        <button id="start-btn" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">Start Quiz <i
                                class="bi bi-arrow-right-short"></i></button>
                    </div>

                    <!-- Progress Bar Container (Hidden initially) -->
                    <div id="progress-container" class="d-none">
                        <div class="progress custom-progress">
                            <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated"
                                role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0"
                                aria-valuemax="100"></div>
                        </div>
                    </div>

                    <!-- Quiz Screen (Hidden initially) -->
                    <div id="quiz-screen" class="card-body p-4 p-md-5 d-none">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span id="question-tracker" class="text-muted fw-bold">Question 1/10</span>
                            <span id="score-badge" class="badge bg-success rounded-pill px-3 py-2 fs-6">Score: 0</span>
                        </div>

                        <h4 id="question-text" class="fw-bold mb-4">Question goes here?</h4>

                        <div id="options-container" class="d-grid gap-3">
                            <!-- Options will be injected here via JS -->
                        </div>

                        <div class="text-end mt-4">
                            <button id="next-btn" class="btn btn-primary rounded-pill px-4 d-none">Next Question <i
                                    class="bi bi-chevron-right ms-1"></i></button>
                        </div>
                    </div>

                    <!-- Result Screen (Hidden initially) -->
                    <div id="result-screen" class="card-body p-5 text-center d-none">
                        <div class="mb-4">
                            <i class="bi bi-trophy text-warning" style="font-size: 5rem;"></i>
                        </div>
                        <h2 class="fw-bold mb-3">Quiz Completed!</h2>
                        <h3 class="text-primary fw-bold mb-4">Your Score: <span id="final-score">0</span> / <span
                                id="total-questions">10</span></h3>
                        <p id="feedback-text" class="text-muted fs-5 mb-5">Great job!</p>
                        <a href="{% url 'home' %}" class="btn btn-outline-primary rounded-pill px-5 py-2 fw-bold">Return
                            Home</a>
                    </div>

                </div>
            </div>
        </div>

        <!-- Bootstrap JS Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Quiz Logic -->
        <script>
            // Quiz Data (will be fetched)
            let quizData = [];

            // Fetch questions from Django API when page loads
            async function fetchQuestions() {
                try {
                    // Determine Category from Django Context
                    const category = "{{ category }}";
                    const response = await fetch(`/api/questions/${category}/`);
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    quizData = await response.json();

                    // If API returns no questions, add a temporary placeholder or handle it
                    if (quizData.length === 0) {
                        quizData = [
                            { question: "No questions available yet. Please add them in Django Admin.", options: [], correctAnswer: 0 }
                        ];
                        startBtn.disabled = true;
                        startBtn.textContent = "No Questions";
                    }
                } catch (error) {
                    console.error('Error fetching questions:', error);
                    startBtn.disabled = true;
                    startBtn.textContent = "Error Loading";
                }
            }

            // Call it immediately
            fetchQuestions();

            // State Variables
            let currentQuestionIndex = 0;
            let score = 0;

            // DOM Elements
            const startScreen = document.getElementById('start-screen');
            const quizScreen = document.getElementById('quiz-screen');
            const resultScreen = document.getElementById('result-screen');

            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');

            const questionCounter = document.getElementById('question-counter');
            const scoreBadge = document.getElementById('score-badge');
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('options-container');
            const nextBtn = document.getElementById('next-btn');

            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');
            const finalScoreEl = document.getElementById('final-score');
            const totalQuestionsEl = document.getElementById('total-questions');
            const feedbackText = document.getElementById('feedback-text');

            // Event Listeners
            startBtn.addEventListener('click', startQuiz);
            nextBtn.addEventListener('click', () => {
                currentQuestionIndex++;
                if (currentQuestionIndex < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            });
            restartBtn.addEventListener('click', resetQuiz);

            // Functions
            function startQuiz() {
                startScreen.classList.add('d-none');
                quizScreen.classList.remove('d-none');
                progressContainer.classList.remove('d-none');
                resetQuizState();
                loadQuestion();
            }

            function resetQuizState() {
                currentQuestionIndex = 0;
                score = 0;
                updateScoreBadge();
            }

            function loadQuestion() {
                // Reset UI for new question
                nextBtn.classList.add('d-none');
                optionsContainer.innerHTML = '';

                const currentQ = quizData[currentQuestionIndex];

                // Update Progress Bar
                const progressPercentage = ((currentQuestionIndex) / quizData.length) * 100;
                progressBar.style.width = `${progressPercentage}%`;

                // Update Text & Counters BEFORE rendering options
                questionText.textContent = currentQ.question;
                document.getElementById('question-tracker').textContent = `Question ${currentQuestionIndex + 1}/${quizData.length}`;

                // Generate Options
                currentQ.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.textContent = option;
                    // Add Bootstrap classes for a clean, outline button look initially
                    button.classList.add('btn', 'btn-outline-secondary', 'option-btn', 'w-100');

                    button.addEventListener('click', () => selectAnswer(index, button));
                    optionsContainer.appendChild(button);
                });
            }

            function selectAnswer(selectedIndex, selectedButton) {
                const currentQ = quizData[currentQuestionIndex];
                const isCorrect = (selectedIndex === currentQ.correctAnswer);

                // Disable all buttons once an answer is chosen
                const allButtons = optionsContainer.querySelectorAll('button');
                allButtons.forEach((btn, index) => {
                    btn.disabled = true;

                    // Remove outline styles for solid colors on reveal
                    btn.classList.remove('btn-outline-secondary');

                    if (index === currentQ.correctAnswer) {
                        // Always show the correct answer in green
                        btn.classList.add('btn-success');
                        btn.innerHTML += ' <i class="bi bi-check-circle-fill float-end mt-1"></i>';
                    } else if (index === selectedIndex && !isCorrect) {
                        // Show the selected wrong answer in red
                        btn.classList.add('btn-danger');
                        btn.innerHTML += ' <i class="bi bi-x-circle-fill float-end mt-1"></i>';
                    } else {
                        // Dim the unselected, wrong answers
                        btn.classList.add('btn-light', 'text-muted');
                    }
                });

                if (isCorrect) {
                    score++;
                    updateScoreBadge();
                }

                // Show Next Button
                nextBtn.classList.remove('d-none');

                // Update progress bar to include this completed question
                const progressPercentage = ((currentQuestionIndex + 1) / quizData.length) * 100;
                progressBar.style.width = `${progressPercentage}%`;
            }

            function updateScoreBadge() {
                scoreBadge.textContent = `Score: ${score}`;
            }

            function showResults() {
                quizScreen.classList.add('d-none');
                progressContainer.classList.add('d-none');
                resultScreen.classList.remove('d-none');

                finalScoreEl.textContent = score;
                totalQuestionsEl.textContent = quizData.length;

                // Give specific feedback based on score
                const percentage = (score / quizData.length) * 100;
                if (percentage === 100) {
                    feedbackText.textContent = "Flawless victory! You know your stuff.";
                } else if (percentage >= 75) {
                    feedbackText.textContent = "Great job! You almost got a perfect score.";
                } else if (percentage >= 50) {
                    feedbackText.textContent = "Not bad, but there's room for improvement.";
                } else {
                    feedbackText.textContent = "Ouch! You might want to brush up on your tech knowledge.";
                }

                // Submit score to backend
                const csrfTokenElement = document.querySelector('[name=csrfmiddlewaretoken]');
                if (csrfTokenElement) {
                    const csrfToken = csrfTokenElement.value;
                    const category = "{{ category }}";
                    fetch(`/api/submit_score/${category}/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({ score: score })
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status !== 'success') {
                                console.error('Failed to save score:', data.message);
                            }
                        })
                        .catch(error => console.error('Error saving score:', error));
                }
            }

            function resetQuiz() {
                resultScreen.classList.add('d-none');
                startScreen.classList.remove('d-none');
                // Reset progress bar visually
                progressBar.style.width = `0%`;
            }
        </script>
</body>

</html>
